<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · PilotKYC</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" id="fav">
  <style>
    :root { --bg:#fff; --text:#0e1530; --muted:#55607a; --accent:#2a55e5; --border:#e1e6f0; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0a0f1f; --text:#e8edff; --muted:#9aa6c7; --accent:#7c9dff; --border:#243055; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; line-height:1.6; }
    main { max-width:480px; text-align:center; }
    .code { font-size:4.5rem; font-weight:800; letter-spacing:-.03em; margin:0; background:linear-gradient(135deg,#3b6bff,#12b3a4); -webkit-background-clip:text; background-clip:text; color:transparent; }
    h1 { font-size:1.5rem; margin:.2em 0 .4em; }
    p { color:var(--muted); margin:0 0 1.4em; }
    .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    a { display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border:1px solid var(--border); border-radius:10px; color:var(--accent); font-weight:600; text-decoration:none; }
    a:hover { border-color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <div class="links">
      <a id="home" href="/">PilotKYC home</a>
      <a id="docs" href="/docs/">Documentation</a>
    </div>
  </main>
  <script>
    // This page is served for unknown URLs at any depth, so relative links would break.
    // SITE_ROOT is "/" for a root site (https://pilotkyc.github.io/, https://kyc.pilotbot.net/).
    // If the site is ever served from a sub-path, set it to e.g. "/pilotkyc-docs/".
    (function () {
      var SITE_ROOT = "/";
      document.getElementById("home").href = SITE_ROOT;
      document.getElementById("docs").href = SITE_ROOT + "docs/";
      document.getElementById("fav").href = SITE_ROOT + "assets/favicon.svg";
    })();
  </script>
</body>
</html>
